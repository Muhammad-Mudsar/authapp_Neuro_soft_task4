<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus · The future of team collaboration</title>

    <!-- Google Fonts & Font Awesome (same as before) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Shared global styles -->
    <link rel="stylesheet" href="scss/styles.css" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style2.css' %}" />

    <!-- Additional hero-specific styles (only what's needed) -->
    <style>
        /* Hero layout – uses existing design tokens */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 720px;
            width: 100%;
            text-align: center;
            animation: heroFadeIn 0.9s var(--ease-smooth) both;
        }

        @keyframes heroFadeIn {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-logo {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .hero-logo span {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-tagline {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            margin-bottom: 1rem;
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 540px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .hero-buttons .btn-premium {
            min-width: 180px;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            animation: btnPulse 3s ease-in-out infinite;
        }

        .hero-buttons .btn-outline {
            min-width: 180px;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            box-shadow: none;
        }

        .hero-buttons .btn-outline:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.16);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.30);
        }

        @keyframes btnPulse {

            0%,
            100% {
                box-shadow: 0 4px 24px rgba(59, 130, 246, 0.30);
            }

            50% {
                box-shadow: 0 8px 48px rgba(59, 130, 246, 0.50);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .hero-logo {
                font-size: 2.6rem;
            }

            .hero-tagline {
                font-size: 1.2rem;
            }

            .hero-description {
                font-size: 1rem;
                padding: 0 0.5rem;
            }

            .hero-buttons .btn-premium,
            .hero-buttons .btn-outline {
                min-width: 140px;
                width: 100%;
                max-width: 280px;
            }

            .hero-buttons {
                flex-direction: column;
                align-items: center;
            }
        }

        /* A small decorative floating shape – optional */
        .hero-shape {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .hero-shape-1 {
            top: -10%;
            right: -8%;
            background: var(--accent-blue);
        }

        .hero-shape-2 {
            bottom: -10%;
            left: -8%;
            background: var(--accent-purple);
        }

        @media (max-width: 640px) {
            .hero-shape {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient background (same as other pages) -->
    <div class="bg-ambient" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Optional floating shapes for extra depth -->
    <div class="hero-shape hero-shape-1" aria-hidden="true"></div>
    <div class="hero-shape hero-shape-2" aria-hidden="true"></div>

    <!-- Main hero section -->
    <section class="hero" role="main" aria-label="Welcome to Nexus">
        <div class="hero-content">
            <!-- Brand -->
            <div class="hero-logo">Nexus<span>.</span></div>
            <p class="hero-tagline">The future of team collaboration</p>
            <p class="hero-description">
                Secure, fast, and beautifully designed. Start building with your team today.
            </p>

            <!-- Call to action buttons -->
            <div class="hero-buttons">
                <a href="{% url 'accounts:signup' %}" class="btn-premium">
                    <i class="fas fa-rocket" style="margin-right:0.4rem;"></i>
                    Get Started
                </a>
                <a href="{% url 'accounts:login' %}" class="btn-outline btn-premium">
                    <i class="fas fa-sign-in-alt" style="margin-right:0.4rem;"></i>
                    Sign In
                </a>
            </div>

            <!-- Optional small trust badge -->
            <div
                style="margin-top:2.5rem;font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:0.6rem;flex-wrap:wrap;">
                <span><i class="fas fa-check-circle" style="color:var(--success);"></i> 12,000+ teams</span>
                <span><i class="fas fa-shield-alt" style="color:var(--accent-blue);"></i> Enterprise‑grade</span>
                <span><i class="fas fa-bolt" style="color:var(--accent-purple);"></i> Blazing fast</span>
            </div>
        </div>


    </section>

    <!-- Toast container (optional, but included for consistency) -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>



    <!-- Shared JS (optional – not needed for hero, but can be included) -->
    <script src="js/common.js"></script>
</body>

</html>
